<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OPSEC Dating Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=VT323&display=swap" rel="stylesheet">
<style>
/* VOICE: a warm, silly, sincere hacker-con visual novel. Jokes on the surface, heart underneath.
   IDEA: the whole game is a conference badge at 2am: lanyard coral, terminal mint, badge butter on aubergine night.
   PICTURE: large hand-built SVG characters over layered location scenes; the VN stage fills the screen.
   COLOUR and TYPE: aubergine ground, coral accent, mint terminal, butter highlight. Chakra Petch + VT323.
   LAYOUT: phone-first. HUD strip, stage, dialogue box pinned to the bottom; the hub is a map of the con. */
:root{color-scheme:dark;--bg:#1b1026;--panel:#2a1a3a;--panel2:#352349;--ink:#f6eefc;--dim:#bba8cf;--coral:#ff5d73;--mint:#8affc1;--butter:#ffd166;--line:#4d3566}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Chakra Petch',system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--butter);outline-offset:2px}
#app{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
.scr{position:absolute;inset:0;display:none}
.scr.on{display:block}
.term{font-family:'VT323',monospace}
/* backgrounds */
.bg{position:absolute;inset:0;transition:background .6s}
.bg::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);pointer-events:none}
.bg .sign{position:absolute;top:56px;left:50%;transform:translateX(-50%);padding:4px 16px;border:2px solid currentColor;border-radius:6px;font:21px 'VT323',monospace;letter-spacing:.04em;white-space:nowrap;opacity:.85;box-shadow:0 0 18px currentColor inset;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.bg-con{background:radial-gradient(60% 40% at 20% 30%,#ff5d7355,transparent),radial-gradient(50% 35% at 85% 25%,#8affc133,transparent),linear-gradient(#2c1640,#140b1d 70%);color:var(--coral)}
.bg-lock{background:radial-gradient(70% 50% at 50% 20%,#ffd16644,transparent),repeating-linear-gradient(90deg,#24162f 0 80px,#2b1b38 80px 82px),#1d1228;color:var(--butter)}
.bg-ctf{background:radial-gradient(50% 30% at 50% 15%,#8affc166,transparent),repeating-linear-gradient(0deg,#0f1f1a 0 22px,#132a23 22px 24px);color:var(--mint)}
.bg-soc{background:radial-gradient(60% 40% at 70% 20%,#5ab4ff55,transparent),linear-gradient(135deg,#142033,#0f1522);color:#7cc4ff}
.bg-stream{background:radial-gradient(40% 40% at 15% 20%,#ff8fc888,transparent),radial-gradient(40% 40% at 85% 20%,#9b59ff88,transparent),linear-gradient(#2d1238,#1a0b22);color:#ff8fc8}
.bg-hotel{background:radial-gradient(40% 30% at 75% 30%,#ffb34744,transparent),linear-gradient(#2a1d22,#17101a);color:#ffb347}
.bg-roof{background:radial-gradient(2px 2px at 20% 20%,#fff,transparent),radial-gradient(2px 2px at 70% 12%,#fff,transparent),radial-gradient(1.5px 1.5px at 40% 30%,#fff,transparent),radial-gradient(1.5px 1.5px at 88% 34%,#fff,transparent),linear-gradient(transparent 62%,#0b0812 62%),repeating-linear-gradient(90deg,transparent 0 30px,#ffd16622 30px 34px,transparent 34px 70px),linear-gradient(#0d1530,#2b1a44 60%,#40224a);color:#cfd8ff}
.bg-dawn{background:linear-gradient(transparent 62%,#120c18 62%),repeating-linear-gradient(90deg,transparent 0 30px,#00000033 30px 34px,transparent 34px 70px),linear-gradient(#3b4a8a,#ff9a7a 55%,#ffd166);color:#fff}
.bg-stage{background:radial-gradient(30% 60% at 50% 0%,#fff3,transparent),radial-gradient(60% 40% at 50% 100%,#ff5d7344,transparent),linear-gradient(#1c0f2a,#0e0816);color:#fff}
.bg-keynote{background:radial-gradient(30% 70% at 50% 0%,#ffffff40,transparent),radial-gradient(70% 30% at 50% 100%,#5ab4ff44,transparent),repeating-linear-gradient(90deg,#141a2a 0 120px,#182036 120px 240px);color:#b0d4ff}
.bg-vendor{background:repeating-linear-gradient(45deg,#2a1a3a 0 30px,#30203f 30px 60px);color:var(--butter)}
.bg-party{background:radial-gradient(30% 30% at 25% 30%,#ff5d73aa,transparent),radial-gradient(30% 30% at 75% 25%,#8affc188,transparent),radial-gradient(40% 30% at 50% 70%,#9b59ff88,transparent),#12081a;color:#fff;animation:party 3s infinite alternate}
.bg-void{background:#07040a;color:var(--coral)}
.bg-flat{background:radial-gradient(40% 30% at 80% 25%,#7cc4ff33,transparent),linear-gradient(90deg,#231a2b 0 60%,#2b2034 60%);color:#7cc4ff}
.bg-bakery{background:radial-gradient(60% 40% at 30% 20%,#ffd9a077,transparent),repeating-linear-gradient(90deg,#5a3a2a 0 40px,#61402e 40px 80px),#4a2e22;color:#ffd9a0}
.bg-office{background:linear-gradient(#cfd6dd22,#0000),repeating-linear-gradient(0deg,#23262e 0 60px,#272b34 60px 62px),#1f222a;color:#cfd6dd}
.bg-train{background:linear-gradient(transparent 55%,#1a1420 55%),repeating-linear-gradient(90deg,#4a6a8a 0 6px,#6a8aaa 6px 140px),linear-gradient(#7a9aba,#c0a0c0);color:#fff}
.bg-cos{background:radial-gradient(40% 50% at 70% 20%,#2bf0ff44,transparent),radial-gradient(40% 50% at 20% 60%,#ff5fb044,transparent),linear-gradient(#1a1430,#100a1c);color:#2bf0ff}
.bg-chill{background:radial-gradient(18% 30% at 15% 70%,#ff8fc866,transparent),radial-gradient(18% 30% at 85% 60%,#8affc155,transparent),radial-gradient(18% 30% at 50% 80%,#c9b6ff55,transparent),#140c1e;color:#c9b6ff}
.bg-bar{background:radial-gradient(50% 30% at 50% 10%,#ff9a5c55,transparent),repeating-linear-gradient(90deg,#3a2418 0 14px,#2e1c12 14px 16px),#241510;color:#ff9a5c}
.bg-lobby{background:radial-gradient(50% 40% at 50% 0%,#ffe0a044,transparent),repeating-linear-gradient(90deg,#2d2230 0 100px,#34283a 100px 102px),#251b2a;color:#ffe0a0}
@keyframes party{to{filter:hue-rotate(60deg)}}
@media (prefers-reduced-motion:reduce){.bg-party{animation:none}}
/* HUD */
#hud{position:absolute;top:0;left:0;right:0;height:48px;display:flex;align-items:center;gap:6px;padding:0 8px;background:linear-gradient(#000b,#0000);z-index:20}
#hud .when{font:19px 'VT323',monospace;color:var(--butter);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}
.meters{display:flex;gap:5px;flex:1;justify-content:flex-end;overflow:hidden}
.m{display:flex;flex-direction:column;width:44px;font:14px 'VT323',monospace;line-height:1;color:var(--dim)}
.m b{display:block;height:5px;border-radius:3px;background:#ffffff1f;margin-top:3px;overflow:hidden}
.m b i{display:block;height:100%;border-radius:3px}
.hb{position:relative;border:1px solid var(--line);background:var(--panel);border-radius:8px;height:36px;min-width:40px;padding:0 9px;font-size:14px;flex:none}
.hb .dot{position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 2px var(--bg)}
/* VN */
#por{position:absolute;left:0;right:0;bottom:150px;height:calc(100% - 210px);display:flex;justify-content:center;align-items:flex-end;pointer-events:none;z-index:5;gap:0}
#por svg{height:100%;max-height:560px;width:auto;filter:drop-shadow(0 10px 30px #0009);animation:pin .3s ease-out}
#por.two svg{max-width:52%;height:88%}
#por svg.dim{filter:brightness(.55) drop-shadow(0 10px 30px #0009)}
@keyframes pin{from{transform:translateY(10px);opacity:0}}
@media (prefers-reduced-motion:reduce){#por svg{animation:none}}
#box{position:absolute;left:50%;transform:translateX(-50%);width:min(980px,calc(100% - 16px));bottom:max(10px,env(safe-area-inset-bottom));min-height:140px;background:linear-gradient(#2a1a3af2,#1e1229f7);border:2px solid var(--line);border-radius:16px;padding:22px 18px 18px;z-index:10;cursor:pointer;box-shadow:0 -6px 30px #0008}
#who{position:absolute;top:-16px;left:16px;padding:2px 14px;border-radius:999px;font-weight:700;font-size:15px;background:var(--coral);color:#1b1026}
#who:empty{display:none}
#txt{font-size:17px;min-height:3em}
#txt.narr{color:#d9cbe6;font-style:italic}
#txt.whisper{font:22px/1.25 'VT323',monospace;color:var(--coral);text-shadow:0 0 8px #ff5d7388}
#txt.sms{font:20px/1.25 'VT323',monospace;color:var(--mint)}
#nexti{position:absolute;right:16px;bottom:6px;color:var(--butter);font-size:13px;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.2}}
#chs{position:absolute;left:50%;transform:translateX(-50%);width:min(760px,calc(100% - 24px));bottom:168px;display:flex;flex-direction:column;gap:9px;z-index:15;max-height:calc(100% - 230px);overflow-y:auto}
#chs:not(:empty)~#por,#vn.choosing #por{filter:brightness(.6)}
.ch{min-height:48px;text-align:left;padding:10px 16px;border-radius:12px;border:2px solid var(--line);background:#1b1026f0;font-size:16px;box-shadow:0 4px 14px #0007}
.ch:hover,.ch:focus-visible{border-color:var(--butter);background:#352349}
.ch small{display:block;color:var(--dim);font-size:13px}
/* chapter card */
#card{position:absolute;inset:0;z-index:50;display:none;place-items:center;background:#07040af2;text-align:center;padding:20px;cursor:pointer}
#card.on{display:grid}
#card .k{font:20px 'VT323',monospace;color:var(--coral)}
#card h2{margin:6px 0;font:clamp(40px,11vw,64px)/1 'VT323',monospace;color:var(--butter);text-wrap:balance}
#card p{color:var(--dim);margin:6px 0 0}
#card .tap{margin-top:30px;font-size:13px;color:var(--dim);animation:bl 1.4s infinite}
/* hub */
#hub{overflow-y:auto;padding:58px 12px 28px}
#hub h2{font:30px/1.05 'VT323',monospace;margin:2px 4px 0;color:var(--butter)}
#hub p.sub{margin:2px 4px 12px;color:var(--dim);font-size:14px}
.story{display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin-bottom:12px;padding:12px 14px;border-radius:14px;border:2px solid var(--coral);background:linear-gradient(90deg,#ff5d7333,#ff5d7308)}
.story b{display:block;font-size:16px}
.story small{display:block;color:var(--dim);font-size:13px}
.story span.ar{margin-left:auto;font:26px 'VT323',monospace;color:var(--coral)}
.map{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(max-width:480px){#hud .when .t{display:none}.hb{padding:0 7px}}
@media(min-width:640px){.map{grid-template-columns:repeat(3,minmax(0,1fr))}}
.loc{position:relative;display:flex;flex-direction:column;justify-content:flex-end;min-height:128px;text-align:left;border:2px solid var(--line);border-radius:14px;padding:10px 12px;overflow:hidden;background:var(--panel)}
.loc .thumb{position:absolute;right:-6px;top:-2px;width:72px;height:86px}
.loc strong,.loc span{text-shadow:0 1px 3px #1b1026,0 0 8px #1b1026}
.loc .thumb svg{width:100%;height:100%}
.loc strong{position:relative;font-size:15px;line-height:1.15}
.loc span{position:relative;font-size:13px;color:var(--dim)}
.loc .tag{position:absolute;left:10px;top:10px;font:15px 'VT323',monospace;background:var(--butter);color:#1b1026;padding:0 6px;border-radius:4px;z-index:2}
.loc::before{content:"";position:absolute;inset:0;opacity:.6;background:linear-gradient(160deg,var(--lc,#fff2),transparent 62%)}
/* overlays */
.ov{position:absolute;inset:0;background:#0a0610ea;z-index:40;display:none;overflow-y:auto;padding:58px 14px 24px}
.ov.on{display:block}
.card{max-width:580px;margin:0 auto;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:18px}
.card h3{margin:0 0 4px;font:28px/1.1 'VT323',monospace;color:var(--butter)}
.btn{min-height:46px;padding:10px 18px;border-radius:12px;border:2px solid var(--line);background:var(--panel2);font-weight:600}
.btn.pri{background:var(--coral);border-color:var(--coral);color:#1b1026}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.tabs{display:flex;gap:6px;margin:6px 0 12px;flex-wrap:wrap}
.tabs button{min-height:40px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);font-size:14px}
.tabs button.on{background:var(--butter);color:#1b1026;border-color:var(--butter)}
.item{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.item div{flex:1}
.item small{display:block;color:var(--dim);font-size:13px}
.price{font:20px 'VT323',monospace;color:var(--butter);white-space:nowrap}
.bar{height:8px;border-radius:4px;background:#ffffff1a;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%}
.girl{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.girl .hd{width:52px;height:60px;flex:none}
.girl .hd svg{width:100%;height:100%}
.girl div.i{flex:1}
.dots{font:16px 'VT323',monospace;color:var(--butter)}
.logl{padding:6px 0;border-top:1px solid #4d356655;font-size:14px}
.logl b{color:var(--butter)}
.sms{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.sms .hd{width:40px;height:46px;flex:none}
.sms .hd svg{width:100%;height:100%}
.sms .bub{background:#120c18;border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:8px 12px;font-size:15px}
.sms .bub b{display:block;font-size:13px}
/* tutorial */
.tut{border-color:var(--mint);box-shadow:0 0 40px #8affc122}
.tut .k{font:18px 'VT323',monospace;color:var(--mint)}
/* minigames */
.q{font-size:18px;font-weight:600;margin:8px 0 12px}
.ans{display:flex;flex-direction:column;gap:8px}
.ans .ch{background:var(--panel2)}
.react{margin-top:12px;padding:10px 12px;border-radius:10px;background:#1b1026;border-left:4px solid var(--coral)}
.mhead{display:flex;gap:10px;align-items:center}
.mhead .hd{width:56px;height:66px;flex:none}
.mhead .hd svg{width:100%;height:100%}
.msg{background:#120c18;border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.msg .from{font:18px 'VT323',monospace;color:var(--mint);overflow-wrap:anywhere}
.cmd{min-height:52px;background:#07110d;border:1px solid #2f5a49;border-radius:10px;padding:10px 12px;font:22px/1.2 'VT323',monospace;color:var(--mint);overflow-wrap:anywhere}
.cmd::before{content:"$ ";color:var(--butter)}
.toks{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tok{min-height:44px;min-width:44px;padding:6px 12px;border-radius:8px;border:2px solid #2f5a49;background:#0e1d17;font:22px 'VT323',monospace;color:var(--mint)}
.tok:disabled{opacity:.25}
.timer{height:6px;border-radius:3px;background:#ffffff1a;margin:10px 0;overflow:hidden}
.timer i{display:block;height:100%;background:var(--coral);transition:width .25s linear}
.track{position:relative;height:64px;border-radius:12px;background:#120c18;border:2px solid var(--line);margin:14px 0;overflow:hidden;cursor:pointer}
.track .zone{position:absolute;top:0;bottom:0;background:#8affc155;border-left:2px solid var(--mint);border-right:2px solid var(--mint)}
.track .mk{position:absolute;top:4px;bottom:4px;width:6px;margin-left:-3px;border-radius:3px;background:var(--butter);box-shadow:0 0 12px var(--butter)}
.code{font:19px/1.3 'VT323',monospace;background:#07110d;border:1px solid #2f5a49;border-radius:10px;padding:6px}
.code button{display:block;width:100%;text-align:left;min-height:40px;padding:6px 10px;border:2px solid transparent;border-radius:6px;background:none;font:inherit;color:var(--mint);white-space:pre-wrap;overflow-wrap:anywhere}
.code button.sel{border-color:var(--coral);background:#ff5d7322}
.code button.bad{border-color:var(--coral)}
.code button.miss{border-color:var(--butter);border-style:dashed}
.plan{display:grid;gap:10px}
.task{background:var(--panel2);border-radius:12px;padding:10px 12px;border:2px solid var(--line)}
.task.ok{border-color:var(--mint)}
.task b{display:block}
.task small{color:var(--dim);display:block;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:40px;padding:4px 12px 4px 4px;border-radius:999px;border:2px solid var(--line);background:#1b1026;display:flex;align-items:center;gap:6px;font-size:14px}
.chip .hd{width:30px;height:34px}
.chip .hd svg{width:100%;height:100%}
.chip.on{border-color:var(--mint);background:#8affc122}
.chip:disabled{opacity:.3}
/* title */
#title{background:radial-gradient(60% 40% at 50% 30%,#ff5d7340,transparent),radial-gradient(50% 30% at 50% 80%,#8affc120,transparent),var(--bg);overflow-y:auto}
.tin{max-width:520px;margin:0 auto;padding:36px 20px 30px;display:flex;flex-direction:column;align-items:center;text-align:center}
.lanyard{width:12px;height:56px;background:repeating-linear-gradient(45deg,var(--coral) 0 8px,#c8344a 8px 16px);border-radius:2px}
.badge{width:min(320px,90%);background:#f6eefc;color:#1b1026;border-radius:18px;padding:16px 18px 18px;box-shadow:0 20px 50px #000a;transform:rotate(-2deg)}
.badge .hole{width:46px;height:10px;border-radius:5px;background:var(--bg);margin:0 auto 10px}
.badge h1{margin:0;font:46px/0.95 'VT323',monospace;text-wrap:balance}
.badge h1 em{font-style:normal;color:var(--coral)}
.badge p{margin:8px 0 0;font-size:13px;color:#5b4870}
.heads{display:flex;justify-content:center;flex-wrap:wrap;margin:4px 0 0;max-width:420px}
.heads span{width:50px;height:86px;margin:0 -7px}
.heads svg{width:100%;height:100%}
.tbtns{display:flex;flex-direction:column;gap:10px;width:min(320px,100%);margin-top:20px}
.inp{width:100%;min-height:48px;font:22px 'VT323',monospace;padding:8px 12px;border-radius:10px;border:2px solid var(--line);background:#120c18;color:var(--mint)}
.endlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px;text-align:left}
.endlist div{padding:8px 10px;border-radius:10px;background:var(--panel2);font-size:14px}
.endlist div.no{color:var(--dim)}
#toasts{position:absolute;top:52px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:4px;z-index:60;pointer-events:none}
.toast{font:19px 'VT323',monospace;padding:2px 12px;border-radius:999px;background:#000d;border:1px solid var(--line);animation:tst 2.4s forwards}
@keyframes tst{0%{opacity:0;transform:translateY(-6px)}10%,75%{opacity:1;transform:none}100%{opacity:0}}
.small{font-size:13px;color:var(--dim)}

/* 3D world */
#gl{position:absolute;inset:0;width:100%;height:100%;display:none;z-index:0;background:#0a0610}
#world{z-index:3}
#tzone{position:absolute;inset:0;touch-action:none;cursor:crosshair}
#cross{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#fffc;box-shadow:0 0 0 1.5px #0008;pointer-events:none}
#areaName.fade{animation:af 3.2s forwards}
@keyframes af{0%{opacity:0}12%,70%{opacity:1}100%{opacity:0}}
#objN{color:var(--butter);font-size:12px}
#objN:empty{display:none}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:70;transition:opacity .25s}
#fade.on{opacity:1}
#cross.hot{background:var(--butter);width:10px;height:10px;margin:-5px}
#world.touch #cross{display:none}
.bg-dim{background:linear-gradient(#0a061000 30%,#0a0610b0)!important}
.bg-dim::after{display:none}
/* phone */
.ov.phoneov{padding:56px 10px 12px;display:grid;place-items:center}
.phone{position:relative;width:min(390px,100%);height:min(760px,calc(100dvh - 70px));background:linear-gradient(160deg,#2b1640,#120a1a 60%);border:3px solid #4d3566;border-radius:34px;box-shadow:0 30px 80px #000c,inset 0 0 0 6px #0a0610;display:flex;flex-direction:column;overflow:hidden;padding:10px 12px 8px}
.pbar{display:flex;justify-content:space-between;align-items:center;font:15px 'VT323',monospace;color:var(--dim);padding:2px 10px 6px}
.bat{width:24px;height:11px;border:1.5px solid var(--dim);border-radius:3px;padding:1px;display:block}
.bat b{display:block;height:100%;background:var(--mint);border-radius:1px}
.ptop{display:flex;align-items:center;gap:8px;padding:4px 2px 8px;border-bottom:1px solid var(--line)}
.ptop b{font-size:17px}
.pback{min-width:44px;min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-size:24px;line-height:1}
.pbody{flex:1;overflow-y:auto;padding:10px 4px}
.phome{align-self:center;width:120px;height:6px;border-radius:3px;border:0;background:#bba8cf;margin:8px 0 2px;padding:0;min-height:0}
.phome::after{content:"";display:block;margin-top:-16px;height:28px}
.home .clock{text-align:center;font:64px/1 'VT323',monospace;color:var(--ink);margin-top:14px}
.home .date{text-align:center;color:var(--dim);font-size:13px;margin-bottom:22px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 8px}
.app{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px}
.app .ic{position:relative;width:60px;height:60px;border-radius:16px;display:grid;place-items:center;box-shadow:0 6px 14px #0006}
.app .ic svg{width:34px;height:34px}
.app .ic i{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;border-radius:11px;background:var(--coral);color:#fff;font:600 12px/22px 'Chakra Petch';font-style:normal;padding:0 5px}
.app .nm{font-size:13px}
.chat{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:8px 2px}
.chat .hd{width:42px;height:48px;flex:none}.chat .hd svg{width:100%;height:100%}
.chat b{display:block;font-size:15px}.chat small{display:block;color:var(--dim);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thread{display:flex;flex-direction:column;gap:8px}
.bub2{align-self:flex-start;max-width:85%;background:var(--panel2);border-radius:4px 16px 16px 16px;padding:8px 12px;font-size:15px}
.bub2 small{display:block;color:var(--dim);font-size:11px;margin-top:2px}
#pmap{width:100%;height:auto;border-radius:12px;border:1px solid var(--line);margin:6px 0}
.ft{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.ft .btn{min-height:40px;padding:6px 12px;font-size:13px}
.goal{background:var(--panel2);border-left:4px solid var(--mint);border-radius:0 12px 12px 0;padding:10px 12px;margin-bottom:14px}
.goal small{display:block;color:var(--dim);font:15px 'VT323',monospace}
.clue{background:var(--panel2);border-radius:10px;padding:8px 12px;margin-bottom:8px;font-size:14px}.clue small{color:var(--butter);font:15px 'VT323',monospace;margin-right:6px}
/* ---- world HUD layout (no overlaps) ---- */
#obj{position:absolute;top:58px;left:12px;max-width:340px;background:#0a0610c4;border-left:3px solid var(--mint);border-radius:0 10px 10px 0;padding:7px 12px;font-size:14px;pointer-events:none;line-height:1.35}
#mini{position:absolute;top:58px;right:12px;width:140px;height:140px;border-radius:50%;border:2px solid var(--line);box-shadow:0 4px 20px #0008;pointer-events:none}
#areaName{position:absolute;top:30%;left:50%;transform:translateX(-50%);font:30px 'VT323',monospace;color:var(--butter);text-shadow:0 2px 8px #000,0 0 2px #000;pointer-events:none;opacity:0;white-space:nowrap}
#prompt{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);display:none;align-items:center;gap:10px;z-index:5;pointer-events:none;background:#1b1026e6;border:2px solid var(--butter);border-radius:999px;padding:6px 18px 6px 6px;font-weight:600;font-size:16px;max-width:min(560px,86vw);box-shadow:0 6px 20px #0008}
#promptK{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--butter);color:#1b1026;font:22px 'VT323',monospace;flex:none}
#promptT{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lockHint{position:absolute;left:50%;top:58%;transform:translateX(-50%);background:#0a0610cc;border:1px solid var(--line);border-radius:999px;padding:8px 18px;font-size:15px;pointer-events:none;display:none}
#keys{position:absolute;left:12px;bottom:12px;font-size:12px;color:var(--dim);background:#0a0610a8;border-radius:8px;padding:5px 10px;pointer-events:none;display:none}
#keys b{color:var(--ink);font:15px 'VT323',monospace;background:#ffffff1a;border-radius:4px;padding:0 5px;margin:0 2px 0 8px}
#keys b:first-child{margin-left:0}
body.desk #keys{display:block}
body.desk.unlocked #lockHint{display:block}
#joy{display:none;position:absolute;left:28px;bottom:36px;width:136px;height:136px;border-radius:50%;border:2px solid #ffffff55;background:radial-gradient(#ffffff14,#0005);pointer-events:none}
#knob{position:absolute;left:41px;top:41px;width:54px;height:54px;border-radius:50%;background:#ffffffcc;box-shadow:0 3px 10px #0006;transition:background .15s}
#joy.run #knob{background:var(--butter)}
#actBtn{display:none;position:absolute;right:26px;bottom:44px;width:88px;height:88px;border-radius:50%;border:3px solid var(--butter);background:#1b1026e6;font-weight:700;font-size:15px;box-shadow:0 6px 20px #0009;z-index:6}
body.touchui #joy{display:block}
body.touchui #cross,body.touchui #keys,body.touchui #lockHint{display:none!important}
body.touchui #world.near #actBtn{display:grid;place-items:center}
body.touchui #prompt{left:auto;right:18px;bottom:144px;transform:none;padding:6px 14px;font-size:14px;max-width:calc(100vw - 200px)}
body.touchui #promptK{display:none}
@media(max-width:760px){#obj{max-width:calc(100% - 160px);font-size:13px}#mini{width:118px;height:118px}body.inworld #toasts{top:186px}#areaName{font-size:26px}}
@media(min-width:900px){#txt{font-size:19px}#box{min-height:150px;padding:24px 26px 22px}#por{bottom:160px}.ch{font-size:17px}}
.kn{display:none;font:16px 'VT323',monospace;background:#ffffff1a;border-radius:4px;padding:0 6px;margin-right:8px;color:var(--butter)}
body.desk .kn{display:inline-block}
#saveList .slot{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
#saveList .slot .info{flex:1;min-width:0}
#saveList .slot .info b{display:block}
#saveList .slot .info small{display:block;color:var(--dim);font-size:13px}
#saveList .slot .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
#saveList .slot .acts .btn{min-height:40px;padding:6px 12px;font-size:13px}
.codebox{width:100%;min-height:90px;font:13px monospace;background:#120c18;color:var(--mint);border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:8px}
</style>

 ()=>[{bg:'soc'},

 ],
 ()=>[{bg:'soc'},
  N('The village is quiet. Priya\'s dashboards cycle through green. She\'s been staring at the same one for a while.'),
  L('priya','d','I was doxxed at nineteen. One forum argument about a video game. A week later, strangers knew where my parents lived.'),
  L('priya','d','We moved. I changed my surname. I built my whole career so it can\'t happen to anyone else. Or to me, again.'),
  ()=>S.exp>=60?[L('priya','d','I like you, {h}. I do. But you leave a trail everywhere you go. I can\'t be near that right now.'),N('She puts her headphones on. The conversation is over. (Lower your Exposure and come back.)'),FX({priya:-3,flag:'hold'})]:[
   C({t:'"Want to get food? My phone goes in the Faraday pouch."',if:()=>S.inv.faraday,fx:{priya:20},then:[L('priya','o','You brought a Faraday pouch. For me.'),L('priya','b','That\'s the most romantic thing that has ever happened to me. Don\'t tell anyone. Obviously.')]},
    {t:'"That\'s awful. I\'m really glad you\'re okay."',fx:{priya:12},then:[L('priya','b','...Thanks. Most people just ask what VPN would\'ve stopped it.')]},
    {t:'"That\'s why I use a VPN."',fx:{priya:-6,clout:2},then:[L('priya','a','A VPN wouldn\'t have helped. Not posting would have helped.')]}),
   L('priya','n','Tomorrow, I\'m writing the disclosure to the regulator. Will you check it with me? I trust your eyes. Mostly.')]
 ],
 ()=>[{bg:'soc'},
  L('priya','n','The disclosure. Regulator first, then a journalist I trust, then the stage. Help me decide what goes in.'),
  C({t:'Include the evidence, Ada\'s verification hashes and a clear timeline',fx:{priya:8,skill:3},then:[L('priya','h','Yes. Facts anyone can check. Nothing they can wave away.')]},
   {t:'Include Victor\'s home address, so he feels it',fx:{priya:-8},then:[L('priya','a','No. Absolutely not. That\'s WHISPER\'s move. We don\'t do that.'),N('She deletes it before you finish the sentence.')]}),
  C({t:'Give Lumen a short window to respond before the keynote',fx:{priya:8},then:[L('priya','n','Yes. They won\'t fix it in four hours. But they can\'t say we ambushed them.')]},

  N('She reads it once more. Then she presses send. The regulator\'s auto-reply comes back in four seconds.'),
  L('priya','b','Sent. Logged. Timestamped. It exists now. They can\'t make it not exist.'),

ROUTES.juno={loc:'stream',blurb:'Streamer. Wants one real thing.',req:[1,2,2,3,4],aff:[0,10,25,40,55],scenes:[

 ],

  L('juno','o','Wait. Look at my VOD from yesterday. Behind me.'),
  N('In the background of her stream: a woman with long silver hair, kneeling at the router by the rooftop stairwell. A second later, gone.'),
  {unlock:'clues'},FX({clue:'silver'}),
  L('juno','b','Thanks, {h}. For real. And I remember the commands. Look. grep. I know grep now.')
 ],
 ()=>[{bg:'stream'},
  L('juno','h','{h}! BIG news. Lumen wants to sponsor me! Twenty thousand pounds! To say SafeSphere is "the only app I trust".'),
  L('juno','o','That\'s rent for a year. And a new ring light. Two ring lights.'),
  C({t:'"Before you sign, let\'s read the contract. And the app\'s permissions."',fx:{juno:6,skill:1},then:[L('juno','n','Read it? The whole thing? Okay, okay. Smart Juno. Smart Juno reads things.')]},
   {t:'"Take the money. Everyone does sponsorships."',fx:{juno:2,clout:3},then:[L('juno','s','Right?! Okay, just... let me look at it first. Priya would kill me.')]}),
  N('Clause 7: "Creator will state that SafeSphere never collects personal data." Clause 9: "Creator will install SafeSphere 2 beta on stream and grant all permissions."'),
  {unlock:'clues'},FX({clue:'sponsor'}),
  {game:'spot',keys:['sponsor'],who:'juno',mult:6},
  L('juno','d','An always-on microphone. In my room. Where I stream. Where I sleep.'),
  L('juno','d','They want me to tell fifty thousand people it\'s safe.'),
  C({t:'"Your chat trusts you. That\'s worth more than twenty grand."',fx:{juno:12},then:[L('juno','b','...They do, don\'t they. Even the ones who call me fake. They keep showing up.')]},
   {t:'"Say no, then make a video about why."',fx:{juno:10,clout:4},then:[L('juno','h','Oh. OH. "I said no to twenty grand, here\'s why." That would do numbers. Honest numbers.')]}),
  N('She types a polite, extremely firm no. Then she unfollows Lumen on every platform, one by one, with tiny ceremonial clicks.'),
  FX({flag:'juno_said_no'})
 ],
 ()=>[{bg:'stream'},
  L('juno','h','BIG stream tonight. Fifty thousand people. The con gave me a practice server to hack live. Totally legal. Marge signed it.'),
  L('juno','d','Chat wants a hacker moment. I could do it. Or you could. You\'re faster.'),
  C({t:'"You do it. I\'ll coach you off-camera."',fx:{juno:18,skill:2},then:[N('Juno\'s hands shake. Then they don\'t. Three commands later, the practice server prints its flag.'),CHAT('WAIT SHE ACTUALLY DID IT / GENUINELY IMPRESSIVE / taking back what I said'),L('juno','h','Chat... I did that. ME.'),FX({flag:'juno_real'})]},
   {t:'Do it yourself, with lots of flair',fx:{juno:8,clout:8,skill:2},then:[N('You crack it in front of fifty thousand people. Chat goes feral. Juno claps, a little wistfully.'),L('juno','h','You\'re amazing. Next time, I\'m driving.')]},
   {t:'Open a fake "hacker typer" site and mash the keyboard',fx:{clout:12,juno:-8},then:[CHAT('bro that\'s literally hackertyper lmaooo / FAKE / ratio'),L('juno','d','...They noticed. Of course they noticed.'),L('juno','d','I wanted one real thing, {h}.'),N('She ends the stream early. You should probably apologise. Come back with something real.')]})
 ],
 ()=>[{bg:'stream'},
  L('juno','n','Okay. The keynote. Marge says if we go up there, someone needs to make sure it\'s seen live, everywhere, before Lumen\'s lawyers can make a phone call.'),
  L('juno','h','Fifty thousand viewers. Clips on every platform. I can do that. That\'s the one thing I\'m actually, really good at.'),
  L('juno','d','I lose the Lumen deal forever. Probably other sponsors too. They\'re all scared of lawyers.'),
  C({t:'"You\'ll gain something better. People who believe you."',fx:{juno:12},then:[L('juno','b','People who believe me. I want that so much it\'s embarrassing.')]},
   {t:'"I\'ll help you find new sponsors. Honest ones."',fx:{juno:10},then:[L('juno','h','A privacy-respecting sponsor? Does that exist? Is that a unicorn?')]}),
  L('juno','n','Can we... go for a walk? Camera off. No chat. Just me. Real me.'),

   {t:'"Then don\'t say it yet. Say it when you mean it."',fx:{juno:12},then:[L('juno','o','Who ARE you?'),L('juno','b','Okay. I\'ll save it. For the afterparty. No pressure. Lots of pressure.')]}),
  FX({flag:'juno_done'})
 ]],
 idle:['Juno is between streams, re-tying a twin-tail.','"Hiii! Wanna do a quick segment?"']
};

ROUTES.kit={loc:'cos',blurb:'Cosplayer. Different person in the armour.',req:[1,2,2,3,4],aff:[0,10,25,40,55],scenes:[
 ()=>[{bg:'cos'},

  L('kitc','s','HALT, wanderer! You stand before NEON RONIN, last blade of the Static Bloom! State your purpose!'),

  L('kit','n','In costume I can talk to anyone. Out of it, I\'m... this. I rehearse ordering coffee.'),

   {t:'"This version\'s good too, you know."',fx:{kit:10},then:[L('kit','b','...You can\'t just say things like that to a person holding sandpaper.')]}),
  L('kit','n','The contest is on Day 3. I\'m doing new LED wings. If you\'re around... I could use a solder buddy.'),
  {msg:['kit','solder buddy!! I got you a spare iron. it\'s pink. non-negotiable']}
 ],
 ()=>[{bg:'cos'},
  N('Kit isn\'t at her table. You find her behind a rack of costumes, knees pulled up, phone clutched tight.'),

  {unlock:'clues'},FX({clue:'metadata'}),

   {t:'"Let\'s find him and confront him."',fx:{kit:4,clout:3},then:[L('kit','d','No. Please. I don\'t want to see him. I want him gone.'),N('You take her to Marge instead. The man is escorted out within the hour.')]}),
  N('Back at her table, you strip the metadata from every photo she plans to post. She turns off location tagging in her camera with the grim focus of someone defusing a bomb.'),

 ],

   {t:'"This is your moment. I\'ll cheer from the front row."',fx:{kit:10},then:[N('Kit walks out alone, wings blazing. She wins Best Craftsmanship. In the front row, you cheer loudest.'),N('She finds your face in the crowd and points the sword at you, like a promise.')]}),

 ],

ROUTES.rin={loc:'chill',blurb:'Malware analyst. Knows too much.',req:[2,2,3,3,4],aff:[0,10,25,40,55],scenes:[
 ()=>[{bg:'chill'},
  L('rin','h','You came back. And you brought nobody. Good. Have a worm.'),

  L('rin','a','It\'s not a bug. It\'s the product.'),

  C({t:'"You\'re not crazy. You\'re right. And you\'re scared because you\'re right."',fx:{rin:12},then:[L('rin','b','...Oh. Yes. That\'s exactly the feeling. Thank you for naming it.')]},

 ],
 ()=>[{bg:'chill'},

  T('Bastion guy','—yeah, the intern can help you with the stickers.'),

  {game:'quiz',who:'rin',n:3}
 ],
 ()=>[{bg:'chill'},

  L('rin','d','My NDA says I can\'t share Bastion client work. My boss says if I do, I\'m done. And my work visa is tied to my job.'),

   {t:'"Forget the job. Some things matter more."',fx:{rin:5},then:[L('rin','d','Easy to say when it\'s not your visa.'),ME('...You\'re right. I\'m sorry. Let\'s do it in a way that protects you.'),FX({rin:4})]})
 ],
 ()=>[{bg:'chill'},

  L('victor','s','Three times your salary. A senior title. A team of your own. All you have to do is let that little report... go.'),

   {t:'"Is that a bribe, Mr Hale? Say it a bit louder. For the room."',fx:{rin:10,clout:4},then:[N('Two people on nearby bean bags look up. Victor\'s smile tightens.'),L('rin','n','...No. My answer is no.')]}),
  L('victor','a','You\'ll regret this. Both of you.'),

  L('rin','d','I just turned down three times my salary. My mum is going to kill me.'),
  L('rin','b','...You stayed. You didn\'t have to stay.')
 ],
 ()=>[{bg:'chill'},

  L('rin','n','I spoke to a lawyer Priya knows. I\'m protected if we do it properly. Regulator first. Then the public.'),

const NSLOT=5;
const slotKey=i=>i==='auto'?'opsec3_save':'opsec3_slot_'+i;
function readSlot(i){try{const t=LS.get(slotKey(i));return t?JSON.parse(t):null}catch(e){return null}}
function delSlot(i){try{localStorage.removeItem(slotKey(i))}catch(e){}}
function stamp(){if(G.ok&&S.inWorld)S.pos=[WD.reg,WD.x,WD.z,WD.yaw,WD.y];S.savedAt=Date.now();S.where=(WD.area&&AREAS[WD.area])?AREAS[WD.area].n:(S.ch===0?'Home':'')}
function writeSlot(i){stamp();LS.set(slotKey(i),JSON.stringify(S))}
function canSave(){return S&&!S.ending&&!$('vn').classList.contains('on')&&($('world').classList.contains('on')||$('hub').classList.contains('on'))}
function fmtTime(t){if(!t)return'';const d=new Date(t);return d.toLocaleDateString(undefined,{day:'numeric',month:'short'})+' '+d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'})}
function slotLine(s){if(!s)return'<b>Empty slot</b><small>Nothing saved here yet.</small>';const met=ROM.filter(g=>s.f&&s.f['met_'+g]).length;return`<b>${esc(s.h)} · Ch.${s.ch} ${esc(CHAP[s.ch]?CHAP[s.ch][0]:'')}</b><small>${esc(s.where||'')}${s.where?' · ':''}${met} people met · ${fmtTime(s.savedAt)}</small>`}
const encodeSave=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o))));
function decodeSave(t){t=(t||'').trim();let o=null;try{o=JSON.parse(t)}catch(e){try{o=JSON.parse(decodeURIComponent(escape(atob(t))))}catch(e2){}}if(!o||typeof o!=='object'||!o.h||o.ch===undefined||!o.aff||!o.stage)throw new Error('That doesn\'t look like an OPSEC Dating Simulator save.');return o}
function exportSave(o){
 const name=`opsec-${String(o.h).replace(/[^a-z0-9_-]/gi,'')||'save'}-ch${o.ch}.json`;
 try{const b=new Blob([JSON.stringify(o,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800)}catch(e){}
 return name;
}

  if(a==='load'){const go=()=>{const s=readSlot(k);if(s)resumeGame(s)};live?confirmBtn(b,go):go()}
  if(a==='del')confirmBtn(b,()=>{delSlot(k);toast('Save deleted','var(--coral)');rerender()});
  if(a==='exp'){const s=readSlot(k);if(!s)return;const n=exportSave(s);$('expBox').innerHTML=`<p class="small" style="margin-top:12px">Downloading <b>${esc(n)}</b>. If nothing downloaded (some embedded viewers block downloads), copy this save code and keep it somewhere safe:</p><textarea class="codebox" readonly id="expCode">${encodeSave(s)}</textarea><div class="row"><button class="btn" id="expCopy">Copy code</button></div>`;$('expCopy').onclick=()=>{const t=$('expCode');t.select();try{navigator.clipboard.writeText(t.value).then(()=>toast('Copied','var(--mint)'),()=>{try{document.execCommand('copy');toast('Copied','var(--mint)')}catch(e){}})}catch(e){try{document.execCommand('copy')}catch(e2){}}};$('expBox').scrollIntoView({block:'nearest'})}
 });
 const takeImport=txt=>{try{const o=decodeSave(txt);o.ending=null;$('impMsg').textContent='Save found: '+o.h+', chapter '+o.ch+'. Loading...';setTimeout(()=>resumeGame(o),250)}catch(e){$('impMsg').textContent=e.message}};
 $('impFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>takeImport(String(r.result));r.readAsText(f)};
 $('impGo').onclick=()=>takeImport($('impCode').value);
}
function savesScreen(){
 const draw=()=>{ov(`<div class="card"><h3>Load game</h3><div id="spanel"></div><div class="row"><button class="btn pri" id="sx2">Back</button></div></div>`);savesPanel($('spanel'),'title',draw);$('sx2').onclick=closeOv};draw();
}
function resumeGame(s){
 S=s;closeOv();$('ov').classList.remove('phoneov');
 if(!S.msgs)S.msgs=[];if(!S.log)S.log=[];
 if(S.resume==='ch0'||S.ch===0&&!G.ok){const h=S.h;S=fresh(h);S.resume='ch0';startCh0();return}
 initWorld();
 if(S.pos&&G.ok&&G.regions[S.pos[0]])teleport(S.pos[0],S.pos[1],S.pos[2],S.pos[3],S.pos[4]||0);else if(G.ok)teleportArea(S.ch===0?'flat':'concourse');
 WD.area=null;save();
 if(S.resume==='open'){run(OPEN[S.ch](),hub);return}
 hub();
}

/* ============ DEVICE + KEYBOARD ============ */
(()=>{const coarse=matchMedia&&matchMedia('(pointer:coarse)').matches&&!matchMedia('(pointer:fine)').matches;document.body.classList.add(coarse?'touchui':'desk');if(coarse)WD.touch=true})();
addEventListener('touchstart',()=>{if(!WD.touch)setTouch(true)},{passive:true});
addEventListener('mousemove',e=>{if(WD.touch&&e.movementX!==undefined&&(Math.abs(e.movementX)+Math.abs(e.movementY))>3&&!e.sourceCapabilities?.firesTouchEvents)setTouch(false)});
addEventListener('keydown',e=>{
 if(!S)return;
 const tag=(document.activeElement&&document.activeElement.tagName)||'';if(tag==='INPUT'||tag==='TEXTAREA')return;
 const k=e.key,ovOn=$('ov').classList.contains('on'),isPhone=$('ov').classList.contains('phoneov');
 // phone toggle / escape
 if((k==='p'||k==='P'||k==='Tab')&&!$('title').classList.contains('on')&&!$('card').classList.contains('on')){
  if(isPhone){e.preventDefault();closePhone();return}
  if(!ovOn){e.preventDefault();phone();return}
 }
 if(k==='Escape'&&isPhone){e.preventDefault();if(phApp){if(phThread)phThread=null;else phApp=null;drawPhone()}else closePhone();return}
 if($('card').classList.contains('on')&&(k===' '||k==='Enter')){e.preventDefault();$('card').click();return}
 if(ovOn&&!isPhone){
  const ans=[...$('ov').querySelectorAll('.ans .ch:not([disabled])')];
  if(ans.length&&/^[1-9]$/.test(k)){const b=ans[+k-1];if(b){e.preventDefault();b.click()}return}
  if($('pP')&&!$('pP').disabled){if(k==='1'||k.toLowerCase()==='p'){e.preventDefault();$('pP').click();return}if(k==='2'||k.toLowerCase()==='l'){e.preventDefault();$('pL').click();return}}
  if($('gt')&&!$('gt').disabled&&(k===' '||k==='Enter')){e.preventDefault();$('gt').click();return}
  if((k==='Enter'||k===' ')){const p=[...$('ov').querySelectorAll('.btn.pri:not([disabled])')].pop();if(p){e.preventDefault();p.click()}}
  if(k==='Backspace'&&$('xu')&&!$('xu').disabled){e.preventDefault();$('xu').click()}
  return;
 }
 if($('vn').classList.contains('on')&&!ovOn){
  const chs=[...$('chs').querySelectorAll('.ch')];
  if(chs.length){if(/^[1-9]$/.test(k)&&chs[+k-1]){e.preventDefault();chs[+k-1].click()}return}
  if(k===' '||k==='Enter'||k==='ArrowRight'){e.preventDefault();tapBox()}
 }
});
/* click anywhere on the dialogue scene to advance (desktop convenience) */
$('vn').addEventListener('click',e=>{if(e.target.closest('#chs')||e.target.closest('#box'))return;tapBox()});

titleScreen();
window.__dbg={get S(){return S},set S(v){S=v},go,hub,run,advance,ROUTES,fresh,WD,G,teleport,teleportArea,AREAS,phone,newScenes,objective,doInteract,interactCheck,candidates,worldLive,fullSVG,heightAt,blockedAt,levelOf};

}
